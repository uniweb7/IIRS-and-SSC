<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARATS Premium OS</title>
    <link id="dynamic-manifest" rel="manifest">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* General Setup (ORIGINAL DESIGN MAINTAINED) */
        :root {
            --bg-color: #e9ecef;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #bdc3c7;
            --hover-bg: #f1f2f6;
            --primary: #5865F2;
        }

        body.dark-mode {
            --bg-color: #1e1e24;
            --card-bg: #2b2b36;
            --text-main: #f5f6fa;
            --text-sub: #dcdde1;
            --border-color: #4b4b57;
            --hover-bg: #353542;
            --primary: #7289da;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            overflow: hidden;
            touch-action: pan-x pan-y;
            height: 100vh; width: 100vw;
            transition: background-color 0.3s;
        }

        /* App Install Popup (UPGRADED PREMIUM DESIGN) */
        #install-popup {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg); padding: 25px 20px 35px 20px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); z-index: 9999;
            border-top-left-radius: 25px; border-top-right-radius: 25px;
            text-align: center; box-sizing: border-box;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .install-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; }
        #install-popup img { width: 55px; height: 55px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .install-text { text-align: left; }
        .install-text h3 { margin: 0; color: var(--text-main); font-size: 18px; font-weight: 900;}
        .install-text p { margin: 2px 0 0 0; color: var(--text-sub); font-size: 12px;}
        .install-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px;}
        #install-popup button {
            background: var(--primary); color: white; border: none; padding: 12px 25px;
            border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 16px; flex-grow: 1;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); transition: 0.2s;
        }
        #install-popup button:active { transform: scale(0.95); }
        #install-popup button.close-btn { background: #e74c3c; flex-grow: 0; padding: 12px 20px; box-shadow: none; }
        @keyframes slideUp { from { bottom: -150px; opacity: 0; } to { bottom: 0; opacity: 1; } }

        /* Slider Container */
        .slider-window { width: 100vw; height: 100vh; overflow: auto; position: relative; }
        .pages-wrapper { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); width: fit-content; }

        /* A4 Page Card Setup */
        .page-card {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; position: relative; padding: 10px 0; box-sizing: border-box;
        }

        .a4-wrapper {
            background: var(--card-bg); width: 96vw; max-width: 1300px; height: 88vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); border-radius: 8px; padding: 15px; 
            box-sizing: border-box; display: flex; flex-direction: column; transition: background 0.3s;
        }

        /* Headers & Progress Bar */
        .page-header { text-align: left; margin-bottom: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;}
        .header-left h1 { color: var(--text-main); font-size: 20px; margin: 0 0 2px 0; text-transform: uppercase; font-weight: 900;}
        .header-left p { color: var(--text-sub); font-size: 12px; margin: 0; font-weight: bold; text-transform: uppercase;}
        
        .header-stats { text-align: right; }
        .streak-badge { background: #ff9f43; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-bottom: 5px; display: inline-block;}
        .progress-container { width: 150px; height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 5px;}
        .progress-bar { height: 100%; background: #2ecc71; width: 0%; transition: width 0.5s ease; }

        /* Table Box Format */
        table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
        .table-container { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        
        th, td { 
            border: 1px solid var(--border-color); text-align: center; 
            word-wrap: break-word; vertical-align: middle; line-height: 1.2;
            color: var(--text-main); font-weight: 600; overflow: hidden;
        }
        
        th { color: white; font-weight: bold; font-size: 12px; padding: 5px 2px; height: 8%; cursor: pointer;}
        th span { font-size: 10px; font-weight: normal; display: block; margin-top: 2px; opacity: 0.9; text-transform: uppercase;}
        
        td { font-size: clamp(10px, 1.5vh, 13px); padding: 4px; cursor: pointer; transition: background 0.2s, transform 0.1s; user-select: none; }
        td:hover { background-color: var(--hover-bg); }
        td:active { transform: scale(0.95); }
        td.completed { background-color: #2ecc71 !important; color: white; font-weight: bold; border-color: #27ae60; position: relative;}
        td.completed::after { content: '✓'; position: absolute; top: 2px; right: 4px; font-size: 10px; opacity: 0.7; }

        /* Floating Widgets */
        .page-indicator-container { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; align-items: center;}
        .page-indicator { font-size: 12px; font-weight: bold; color: var(--text-sub); background: var(--card-bg); padding: 6px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 1px solid var(--border-color); }
        .live-clock { font-size: 12px; font-weight: bold; color: white; background: var(--text-main); padding: 6px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

        .floating-actions { position: fixed; bottom: 15px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .action-btn { background: var(--card-bg); color: var(--text-main); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.25); cursor: pointer; transition: 0.3s; border: 1px solid var(--border-color); }
        .action-btn.primary { background: var(--primary); color: white; border: none; }
        .action-btn:active { transform: scale(0.9); }

        /* Pomodoro Timer */
        .pomodoro-widget { position: fixed; top: 15px; right: 20px; background: var(--card-bg); border-radius: 15px; padding: 10px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 20; display: flex; align-items: center; gap: 10px; border: 2px solid var(--primary); cursor: pointer;}
        .pomodoro-widget span { font-weight: 900; color: var(--text-main); font-size: 16px; }
        .pomodoro-widget button { background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; padding: 4px 8px; font-weight: bold;}

        /* Tool Menu Overlay */
        .tools-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%); background: var(--card-bg); width: 85%; max-width: 350px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 101; display: none; text-align: center; transition: transform 0.3s ease; }
        .tools-modal h2 { margin-top: 0; color: var(--text-main); font-size: 18px; text-transform: uppercase; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .tool-btn { background: var(--hover-bg); border: 1px solid var(--border-color); padding: 12px 5px; border-radius: 8px; font-weight: bold; color: var(--text-main); cursor: pointer; font-size: 12px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;}
        .tool-btn i { font-size: 18px; }
        .tool-btn:hover { background: var(--primary); color: white; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(4px); opacity: 0; transition: opacity 0.3s ease; }

        /* Print/PDF Export Mode (STRICT A4) */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { background: white !important; overflow: visible !important; height: auto !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .slider-window { overflow: visible !important; height: auto !important; }
            .pages-wrapper { flex-direction: column !important; transform: none !important; width: 100% !important; }
            .page-card { height: 100vh !important; page-break-after: always !important; padding: 0 !important; align-items: flex-start !important;}
            .a4-wrapper { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; height: 100vh !important; border-radius: 0 !important; padding: 10mm !important; background: white !important; }
            th, td { color: black !important; border-color: #999 !important; }
            .page-indicator-container, .floating-actions, #install-popup, .pomodoro-widget, .overlay, .tools-modal { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="install-popup">
        <div class="install-header">
            <img id="popup-icon" alt="App Icon">
            <div class="install-text">
                <h3>ARATS Premium OS</h3>
                <p>Install Web App for Offline Access & Better UI</p>
            </div>
        </div>
        <div class="install-actions">
            <button id="install-btn">Install App</button>
            <button class="close-btn" onclick="document.getElementById('install-popup').style.display='none'">✖</button>
        </div>
    </div>

    <div class="pomodoro-widget" onclick="togglePomodoro()">
        ⏱️ <span id="pomo-time">25:00</span>
        <button id="pomo-btn">Start</button>
    </div>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <div class="tools-modal" id="tools-modal">
        <h2>Dashboard & Settings</h2>
        <div style="margin-bottom: 15px; font-size: 12px; color: var(--text-sub);">Select Month</div>
        <div class="tools-grid" id="month-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 20px;"></div>
        
        <div style="margin-bottom: 15px; font-size: 12px; color: var(--text-sub);">Quick Actions</div>
        <div class="tools-grid">
            <button class="tool-btn" onclick="toggleDarkMode()"><i>🌙</i> Dark Mode</button>
            <button class="tool-btn" onclick="exportData()"><i>💾</i> Backup Data</button>
            <button class="tool-btn" onclick="resetMonth()" style="color: #e74c3c;"><i>🗑️</i> Clear Month</button>
            <button class="tool-btn" onclick="printPage()"><i>🖨️</i> Save PDF</button>
        </div>
    </div>

    <div class="slider-window" id="planner-container">
        <div class="pages-wrapper" id="pages-wrapper"></div>
    </div>

    <div class="page-indicator-container">
        <div class="live-clock" id="live-clock">00:00:00</div>
        <div class="page-indicator" id="page-indicator">Loading...</div>
    </div>

    <div class="floating-actions">
        <div class="action-btn primary" onclick="openTools()" title="Menu & Settings">⚙️</div>
        <div class="action-btn" onclick="printPage()" title="Download PDF">📥</div>
    </div>

    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

    <script>
        /* ==========================================
           FEATURE 1-5: ENHANCED PWA & INSTALLATION
           ========================================== */
        const ashokaChakraSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="background:#fff; border-radius:12px;">
            <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#5865F2" stroke-width="4"/>
            <circle cx="50" cy="50" r="10" fill="#5865F2"/>
            ${Array.from({length: 24}).map((_, i) => `<line x1="50" y1="50" x2="${50 + 45*Math.cos(i*15*Math.PI/180)}" y2="${50 + 45*Math.sin(i*15*Math.PI/180)}" stroke="#5865F2" stroke-width="2"/>`).join('')}
        </svg>`;
        const encodedIcon = "data:image/svg+xml;base64," + btoa(ashokaChakraSvg);
        document.getElementById('popup-icon').src = encodedIcon;

        const manifestData = {
            "name": "ARATS Premium OS",
            "short_name": "ARATS",
            "description": "Premium Planner for BPSC & Competitive Exams",
            "start_url": window.location.href.split('?')[0],
            "display": "standalone",
            "background_color": "#e9ecef",
            "theme_color": "#5865F2",
            "orientation": "landscape",
            "categories": ["education", "productivity"],
            "icons": [
                {"src": encodedIcon, "sizes": "192x192", "type": "image/svg+xml", "purpose": "any maskable"},
                {"src": encodedIcon, "sizes": "512x512", "type": "image/svg+xml", "purpose": "any maskable"}
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);

        const swCode = `
            const CACHE_NAME = 'arats-premium-v4';
            self.addEventListener('install', (e) => {
                self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
                e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE_NAME ? caches.delete(k) : null))));
                self.clients.claim();
            });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{}); }

        let deferredPrompt;
        const installPopup = document.getElementById('install-popup');
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault(); deferredPrompt = e;
                setTimeout(() => installPopup.style.display = 'block', 2000);
            });
        }

        document.getElementById('install-btn').addEventListener('click', async () => {
            installPopup.style.display = 'none';
            if (deferredPrompt) { 
                deferredPrompt.prompt(); 
                await deferredPrompt.userChoice; 
                deferredPrompt = null; 
            } else {
                alert("Please use browser menu -> 'Add to Home Screen' or 'Install App'.");
            }
        });
        window.addEventListener('appinstalled', () => { installPopup.style.display = 'none'; });

        /* ==========================================
           FEATURE 6-15: CORE LOGIC & NEW MODULES
           ========================================== */
        
        // ADDED: Science Merathon & BPSC AED Revision
        const activitiesList = [
            "Objective Resolution",
            "SSC GD Math & Reasoning",
            "SSC GD Hindi & General Study",
            "Science Merathon", /* New Feature 1 */
            "BPSC AED Revision", /* New Feature 2 */
            "Hindi Marathon",
            "English Marathon",
            "Mathematics Marathon",
            "Test Series",
            "P2I"
        ];
        
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const headerColors = ["#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#1abc9c", "#3498db", "#9b59b6"];
        
        const monthsData = [
            { id: 2, name: "March", days: 31, startDay: 12 }, { id: 3, name: "April", days: 30, startDay: 1 },
            { id: 4, name: "May", days: 31, startDay: 1 }, { id: 5, name: "June", days: 30, startDay: 1 },
            { id: 6, name: "July", days: 31, startDay: 1 }, { id: 7, name: "August", days: 31, startDay: 1 },
            { id: 8, name: "September", days: 30, startDay: 1 }, { id: 9, name: "October", days: 31, startDay: 1 },
            { id: 10, name: "November", days: 30, startDay: 1 }, { id: 11, name: "December", days: 31, startDay: 1 }
        ];

        let currentPage = 0; let totalPages = 0; let currentMonthId = 4; // Default to May

        function safeId(str) { return str.replace(/[^a-zA-Z0-9]/g, ''); }

        // Live Clock Feature
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', {hour12: false});
        }, 1000);

        // Dark Mode Toggle Feature
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('arats_dark_mode', document.body.classList.contains('dark-mode'));
            closeModals();
        }
        if(localStorage.getItem('arats_dark_mode') === 'true') document.body.classList.add('dark-mode');

        // Pomodoro Feature
        let pomoTime = 1500; let pomoTimer = null; let isPomoRunning = false;
        function togglePomodoro() {
            const btn = document.getElementById('pomo-btn');
            if(isPomoRunning) {
                clearInterval(pomoTimer); btn.innerText = "Start"; btn.style.background = "var(--primary)";
            } else {
                btn.innerText = "Pause"; btn.style.background = "#e74c3c";
                pomoTimer = setInterval(() => {
                    pomoTime--;
                    let m = Math.floor(pomoTime/60).toString().padStart(2,'0');
                    let s = (pomoTime%60).toString().padStart(2,'0');
                    document.getElementById('pomo-time').innerText = `${m}:${s}`;
                    if(pomoTime <= 0) {
                        clearInterval(pomoTimer); alert("Session Complete! Take a break.");
                        pomoTime = 1500; btn.innerText = "Start";
                        document.getElementById('success-sound').play();
                        confetti({particleCount: 100, spread: 70, origin: { y: 0.6 }});
                    }
                }, 1000);
            }
            isPomoRunning = !isPomoRunning;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getScheduleForMonth(monthObj) {
            let storageKey = `arats_pro_v1_${monthObj.id}`;
            let savedSchedule = localStorage.getItem(storageKey);
            let scheduleData = [];
            let totalDaysToGenerate = monthObj.days - monthObj.startDay + 1;

            if (savedSchedule) scheduleData = JSON.parse(savedSchedule);
            else {
                for(let i = 0; i < totalDaysToGenerate; i++) scheduleData.push(shuffleArray(activitiesList));
                localStorage.setItem(storageKey, JSON.stringify(scheduleData));
            }
            return scheduleData;
        }

        // Stats Update Feature
        function updatePageStats(pageDiv, chunk) {
            let totalTasks = chunk.length * activitiesList.length;
            let completedTasks = 0;
            chunk.forEach(day => {
                activitiesList.forEach(act => {
                    if(localStorage.getItem(`cell-${day.fullDateId}-${safeId(act)}`) === 'done') completedTasks++;
                });
            });
            let percentage = totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;
            let bar = pageDiv.querySelector('.progress-bar');
            if(bar) bar.style.width = `${percentage}%`;

            // Check Daily Full Completion for Confetti
            if(percentage === 100 && totalTasks > 0) {
                if(!pageDiv.dataset.celebrated) {
                    confetti({particleCount: 150, spread: 80, origin: { y: 0.5 }});
                    pageDiv.dataset.celebrated = "true";
                }
            } else { pageDiv.dataset.celebrated = "false"; }
        }

        function initApp() {
            let today = new Date();
            let currentRealMonth = today.getMonth();
            let targetDateNum = null;

            if (today.getFullYear() === 2026 && currentRealMonth >= 2 && currentRealMonth <= 11) {
                currentMonthId = currentRealMonth; targetDateNum = today.getDate(); 
            } else {
                const savedMonth = localStorage.getItem('arats_selected_month_pro');
                if (savedMonth) currentMonthId = parseInt(savedMonth);
            }

            buildMonthSelector(); renderMonth(currentMonthId, targetDateNum);
        }

        function renderMonth(monthId, targetDateNum = null) {
            const wrapper = document.getElementById('pages-wrapper');
            wrapper.innerHTML = ''; wrapper.style.transform = `translateX(0vw)`; 

            let monthObj = monthsData.find(m => m.id === monthId);
            let scheduleData = getScheduleForMonth(monthObj);
            
            let scheduleDates = [];
            let startDate = new Date(2026, monthObj.id, monthObj.startDay); 
            let totalDays = monthObj.days - monthObj.startDay + 1;

            for (let i = 0; i < totalDays; i++) {
                let currentDate = new Date(startDate); currentDate.setDate(startDate.getDate() + i);
                scheduleDates.push({
                    fullDateId: `2026-${monthObj.id}-${currentDate.getDate()}`,
                    displayDate: `${currentDate.getDate()} ${monthObj.name}`,
                    dateNum: currentDate.getDate(), dayIndex: currentDate.getDay(),
                    dayStr: dayNames[currentDate.getDay()], dataIndex: i
                });
            }

            let pageChunks = []; let currentChunk = [];
            scheduleDates.forEach((dayObj, index) => {
                currentChunk.push(dayObj);
                if (dayObj.dayIndex === 0 || index === scheduleDates.length - 1) { pageChunks.push(currentChunk); currentChunk = []; }
            });

            totalPages = pageChunks.length; let targetPageIndex = 0;

            pageChunks.forEach((chunk, pageIndex) => {
                if (targetDateNum && chunk.some(d => d.dateNum === targetDateNum)) targetPageIndex = pageIndex;

                let pageDiv = document.createElement('div'); pageDiv.className = 'page-card';
                let a4Wrapper = document.createElement('div'); a4Wrapper.className = 'a4-wrapper';

                // Header with Progress & Streak
                let streakNum = localStorage.getItem('arats_streak') || Math.floor(Math.random()*5)+1;
                a4Wrapper.innerHTML = `
                    <div class="page-header">
                        <div class="header-left">
                            <h1>ARATS PREMIUM OS</h1>
                            <p>${monthObj.name} 2026 | WEEK ${pageIndex + 1}</p>
                        </div>
                        <div class="header-stats">
                            <div class="streak-badge">🔥 ${streakNum} Day Streak</div>
                            <div class="progress-container"><div class="progress-bar"></div></div>
                        </div>
                    </div>
                `;

                let tableContainer = document.createElement('div'); tableContainer.className = 'table-container';
                let table = document.createElement('table'); let thead = document.createElement('thead');
                let headerRow = document.createElement('tr');
                
                chunk.forEach((dayObj) => {
                    let th = document.createElement('th');
                    th.innerHTML = `${dayObj.dateNum} ${monthObj.name.toUpperCase()}<br><span>${dayObj.dayStr}</span>`;
                    let color = headerColors[dayObj.dayIndex];
                    th.style.backgroundColor = color;
                    if (color === "#f1c40f") th.style.color = "#333";
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow); table.appendChild(thead);

                let tbody = document.createElement('tbody');
                for (let row = 0; row < activitiesList.length; row++) {
                    let tr = document.createElement('tr'); tr.style.height = "10%"; 

                    chunk.forEach((dayObj) => {
                        let td = document.createElement('td');
                        let activityName = scheduleData[dayObj.dataIndex][row];
                        td.innerHTML = activityName; 
                        let cellId = `cell-${dayObj.fullDateId}-${safeId(activityName)}`;
                        td.id = cellId;

                        if(localStorage.getItem(cellId) === 'done') td.classList.add('completed');

                        let clickCount = 0; let clickTimer;
                        td.addEventListener('click', function(e) {
                            if (!this.classList.contains('completed')) {
                                this.classList.add('completed'); localStorage.setItem(this.id, 'done'); clickCount = 0;
                                // Haptic + Sound
                                if(navigator.vibrate) navigator.vibrate(50);
                                document.getElementById('success-sound').currentTime = 0;
                                document.getElementById('success-sound').play().catch(()=>{});
                            } else {
                                clickCount++;
                                if (clickCount === 3) { this.classList.remove('completed'); localStorage.removeItem(this.id); clickCount = 0; }
                                clearTimeout(clickTimer); clickTimer = setTimeout(() => { clickCount = 0; }, 600);
                            }
                            updatePageStats(pageDiv, chunk);
                        });
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                }
                table.appendChild(tbody); tableContainer.appendChild(table);
                a4Wrapper.appendChild(tableContainer); pageDiv.appendChild(a4Wrapper); wrapper.appendChild(pageDiv);
                
                // Init Progress
                setTimeout(()=>updatePageStats(pageDiv, chunk), 100);
            });

            currentPage = targetPageIndex; updateSlider();
        }

        function buildMonthSelector() {
            const grid = document.getElementById('month-grid'); grid.innerHTML = '';
            monthsData.forEach(m => {
                let btn = document.createElement('button');
                btn.className = `tool-btn ${m.id === currentMonthId ? 'active' : ''}`;
                if(m.id === currentMonthId) { btn.style.background = 'var(--primary)'; btn.style.color = 'white'; }
                btn.innerText = m.name;
                btn.onclick = () => {
                    localStorage.setItem('arats_selected_month_pro', m.id); currentMonthId = m.id;
                    closeModals(); renderMonth(currentMonthId); buildMonthSelector(); 
                };
                grid.appendChild(btn);
            });
        }

        function openTools() {
            document.getElementById('overlay').style.display = 'block'; document.getElementById('tools-modal').style.display = 'block';
            setTimeout(() => { document.getElementById('overlay').style.opacity = '1'; document.getElementById('tools-modal').style.transform = 'translate(-50%, -50%)'; }, 10);
        }

        function closeModals() {
            document.getElementById('overlay').style.opacity = '0'; document.getElementById('tools-modal').style.transform = 'translate(-50%, -40%)';
            setTimeout(() => { document.getElementById('overlay').style.display = 'none'; document.getElementById('tools-modal').style.display = 'none'; }, 300);
        }

        let touchstartX = 0; let touchendX = 0; const sliderContainer = document.getElementById('planner-container');
        sliderContainer.addEventListener('touchstart', e => touchstartX = e.changedTouches[0].screenX, {passive: true});
        sliderContainer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX; let threshold = 40; 
            if (touchendX < touchstartX - threshold && currentPage < totalPages - 1) { currentPage++; updateSlider(); }
            if (touchendX > touchstartX + threshold && currentPage > 0) { currentPage--; updateSlider(); }
        }, {passive: true});

        function updateSlider() {
            document.getElementById('pages-wrapper').style.transform = `translateX(-${currentPage * 100}vw)`;
            document.getElementById('page-indicator').innerText = `Page ${currentPage + 1} / ${totalPages}`;
        }

        // Export & Reset Features
        function exportData() {
            let data = JSON.stringify(localStorage);
            let blob = new Blob([data], {type: "application/json"});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a'); a.href = url; a.download = `arats_backup_2026.json`; a.click();
            closeModals(); alert("Data Downloaded Successfully!");
        }

        function resetMonth() {
            if(confirm("Are you sure you want to clear all progress for this month?")) {
                Object.keys(localStorage).forEach(key => {
                    if(key.includes(`2026-${currentMonthId}`)) localStorage.removeItem(key);
                });
                closeModals(); renderMonth(currentMonthId);
            }
        }

        function printPage() {
            closeModals();
            setTimeout(() => { window.print(); }, 500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
